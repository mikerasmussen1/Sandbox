name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sunstone-siege/package-lock.json
      - name: Install and build
        working-directory: sunstone-siege
        run: npm ci && npm run build
      - name: Include static demo previews
        run: |
          cp -a auric-dynamo sunstone-siege/dist/auric-dynamo
          cp -a lantern-tide sunstone-siege/dist/lantern-tide
          cp -a wyvern-wilds sunstone-siege/dist/wyvern-wilds
          cp -a thunderscale-depths sunstone-siege/dist/thunderscale-depths
          cp -a starlift-fever sunstone-siege/dist/starlift-fever
      - uses: actions/upload-pages-artifact@v3
        with:
          path: sunstone-siege/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
